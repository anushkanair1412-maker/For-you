<!DOCTYPE html>
<html>
<head>
  <title>For You 💌</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #ffe6f0, #fff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: pink;
      font-size: 20px;
      animation: floatUp 6s infinite ease-in;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* Envelope */
    .envelope {
      width: 260px;
      height: 180px;
      background: white;
      position: relative;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .envelope-text {
      color: #ff5c8a;
      font-size: 22px;
      font-weight: bold;
    }

    /* Letter */
    .letter {
      position: absolute;
      width: 300px;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      text-align: center;
      display: none;
      z-index: 3;
      animation: slideUp 0.8s ease forwards;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .letter h2 {
      color: #ff5c8a;
    }

    .hidden-line {
      display: none;
      margin-top: 15px;
      color: #d6336c;
      font-weight: bold;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #ff5c8a;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Envelope -->
  <div class="envelope" onclick="openLetter()">
    <div class="envelope-text">Open me 💗</div>
  </div>

  <!-- Letter -->
  <div class="letter" id="letter">
    <h2>Hi my love 💕</h2>
    <p>
      I just wanted you to know how deeply loved you are.
      Every moment with you feels safe, warm, and special.
      You mean more to me than words can explain.
    </p>

    <button onclick="showMore()">Click for more 💖</button>

    <div class="hidden-line" id="moreText">
      I choose you. Today, tomorrow, always. ❤️
    </div>
  </div>

  <script>
    function openLetter() {
      document.querySelector('.envelope').style.display = 'none';
      document.getElementById('letter').style.display = 'block';
    }

    function showMore() {
      document.getElementById('moreText').style.display = 'block';
    }

    // Create floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (15 + Math.random() * 20) + 'px';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
